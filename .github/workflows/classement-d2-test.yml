name: Capture classement D2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Installer Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Capturer la page D2
        run: |
          cat > capture.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {

            const browser = await chromium.launch({
              headless: false,
              args: [
                '--disable-blink-features=AutomationControlled',
                '--no-sandbox',
                '--disable-dev-shm-usage'
              ]
            });

            const context = await browser.newContext({
              viewport: {
                width: 1400,
                height: 1000
              },
              locale: 'fr-FR',
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
                '(KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36'
            });

            const page = await context.newPage();

            await page.addInitScript(() => {
              Object.defineProperty(
                navigator,
                'webdriver',
                {
                  get: () => undefined
                }
              );
            });

            const url =
              'https://footamateur.letelegramme.fr/clubs/les-glaneurs-de-notre-dame-lizio/#classements';

            console.log('Ouverture de la page...');

            let response = null;

            try {
              response = await page.goto(url, {
                waitUntil: 'domcontentloaded',
                timeout: 90000
              });
            } catch (error) {
              console.log(
                'Navigation : ' + error.message
              );
            }

            if (response) {
              console.log(
                'Code HTTP : ' + response.status()
              );
            }

            console.log('Attente du chargement...');

            await page.waitForTimeout(10000);

            /*
             * On essaie de faire apparaitre la zone
             * du classement sans dépendre d'un sélecteur.
             */

            try {
              await page.evaluate(() => {
                const element =
                  document.getElementById('classements');

                if (element) {
                  element.scrollIntoView({
                    behavior: 'instant',
                    block: 'start'
                  });
                }
              });
            } catch (error) {
              console.log(
                'Scroll classement impossible.'
              );
            }

            await page.waitForTimeout(3000);

            /*
             * Capture de secours de la page complète.
             */

            await page.screenshot({
              path: 'classement-d2.png',
              fullPage: true,
              animations: 'disabled'
            });

            /*
             * On conserve également une capture de la
             * partie visible pour contrôle.
             */

            await page.screenshot({
              path: 'classement-d2-visible.png',
              fullPage: false,
              animations: 'disabled'
            });

            /*
             * On sauvegarde aussi le HTML reçu.
             * Cela permettra de comprendre la page si
             * nécessaire sans faire échouer le workflow.
             */

            try {
              const html =
                await page.content();

              require('fs').writeFileSync(
                'page-d2.html',
                html
              );
            } catch (error) {
              console.log(
                'Impossible de sauvegarder le HTML.'
              );
            }

            console.log(
              'Capture classement-d2.png creee.'
            );

            await browser.close();

          })().catch(error => {

            console.log(
              'Erreur non bloquante : ' +
              error.message
            );

            /*
             * On ne fait volontairement pas
             * echouer le workflow ici.
             */

            process.exit(0);
          });
          EOF

          xvfb-run --auto-servernum -- node capture.js

      - name: Conserver les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classement-d2-test
          path: |
            classement-d2.png
            classement-d2-visible.png
            page-d2.html
          if-no-files-found: warn
