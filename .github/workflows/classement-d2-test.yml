name: Test capture classement D2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Installer Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capturer le classement D2
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1400,
                height: 1200
              },
              deviceScaleFactor: 1
            });

            const url =
              'https://footamateur.letelegramme.fr/clubs/les-glaneurs-de-notre-dame-lizio/#classements';

            console.log('Ouverture de la page...');

            await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 90000
            });

            await page.waitForTimeout(5000);

            console.log('Page chargee.');

            /*
             * On cherche le texte "Équipes".
             * Le site n'utilise pas une balise <table> classique.
             */

            const titre =
              page.getByText('Équipes', {
                exact: true
              }).first();

            if (await titre.count() === 0) {

              console.log(
                'Texte Équipes introuvable.'
              );

              await page.screenshot({
                path: 'debug-d2.png',
                fullPage: true
              });

              throw new Error(
                'Classement D2 introuvable. Voir debug-d2.png'
              );
            }

            console.log(
              'En-tete du classement trouve.'
            );

            /*
             * On remonte dans les conteneurs jusqu'a trouver
             * celui qui contient les equipes du classement.
             */

            let bloc = titre;

            for (let i = 0; i < 8; i++) {

              const parent =
                bloc.locator('xpath=..');

              if (await parent.count() === 0)
                break;

              const texte =
                await parent.innerText();

              if (
                texte.includes('Carentoir') &&
                texte.includes('Caro Missiriac') &&
                texte.includes('Guillac') &&
                texte.includes('Lizio')
              ) {

                bloc = parent;

                console.log(
                  'Bloc du classement trouve au niveau ' +
                  (i + 1)
                );

                break;
              }

              bloc = parent;
            }

            const texteBloc =
              await bloc.innerText();

            /*
             * Verification supplementaire :
             * on doit retrouver plusieurs equipes D2.
             */

            const equipes = [
              'Carentoir',
              'Caro Missiriac',
              'Foug.-St-Martin',
              'Guillac',
              'La Gacilly',
              'Le Roc',
              'Lizio',
              'Ruffiac-Malestroit',
              'St-Guyomard',
              'St-Servant',
              'Sérent',
              'USSAC'
            ];

            let nombreTrouvees = 0;

            for (const equipe of equipes) {

              if (texteBloc.includes(equipe)) {
                nombreTrouvees++;
              }

            }

            console.log(
              'Equipes trouvees : ' +
              nombreTrouvees +
              '/12'
            );

            if (nombreTrouvees < 8) {

              await page.screenshot({
                path: 'debug-d2.png',
                fullPage: true
              });

              throw new Error(
                'Le bloc trouve ne contient pas suffisamment ' +
                'd equipes D2. Voir debug-d2.png'
              );
            }

            /*
             * Capture du classement.
             */

            await bloc.screenshot({
              path: 'classement-d2.png',
              animations: 'disabled'
            });

            console.log(
              'Capture classement-d2.png creee.'
            );

            await browser.close();

          })();
          EOF

      - name: Conserver la capture
        uses: actions/upload-artifact@v4
        with:
          name: classement-d2-test
          path: |
            classement-d2.png
            debug-d2.png
          if-no-files-found: warn
